name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-tests:
    name: Native tests (ASan/UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DVOICECHANGER_BUILD_BENCHMARKS=ON
          -DVOICECHANGER_ENABLE_SANITIZERS=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure

      - name: Smoke-test benchmark harness
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: >-
          ./build/pitch_shift_benchmark
          --blocks 64
          --repetitions 1
          --warmups 1
          --ratio 1.0

  native-benchmark:
    name: Native benchmark (Release report)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure optimized benchmark
        run: >-
          cmake -S . -B build-perf
          -DBUILD_TESTING=OFF
          -DVOICECHANGER_BUILD_BENCHMARKS=ON
          -DVOICECHANGER_ENABLE_SANITIZERS=OFF
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_FLAGS_RELEASE="-O2 -DNDEBUG"

      - name: Build optimized benchmark
        run: >-
          cmake --build build-perf
          --target pitch_shift_benchmark
          --parallel 2

      - name: Run and validate benchmark
        run: |
          set -o pipefail
          ./build-perf/pitch_shift_benchmark \
            --blocks 16384 \
            --repetitions 9 \
            --warmups 2 2>&1 | tee build-perf/pitch-shift-benchmark.txt
          python3 ci/report-host-benchmark.py \
            build-perf/pitch-shift-benchmark.txt \
            --blocks 16384 \
            --repetitions 9 \
            --warmups 2

      - name: Upload benchmark result
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: host-pitch-shift-benchmark-${{ github.run_attempt }}
          path: build-perf/pitch-shift-benchmark.txt
          if-no-files-found: warn
          retention-days: 30

  arduino-compile:
    name: Arduino compile (${{ matrix.board }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: Teensy 4.0
            fqbn: teensy:avr:teensy40:usb=serial,speed=600,opt=o2std,keys=en-us
          - board: Teensy 4.1
            fqbn: teensy:avr:teensy41:usb=serial,speed=600,opt=o2std,keys=en-us

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.5.1

      - name: Install Teensy core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://www.pjrc.com/teensy/package_teensy_index.json
          arduino-cli core update-index
          arduino-cli core install teensy:avr@1.62.0

      - name: Compile all sketches
        run: bash ci/compile-arduino-sketches.sh "${{ matrix.fqbn }}"

  deploy-pages:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs:
      - native-tests
      - native-benchmark
      - arduino-compile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
